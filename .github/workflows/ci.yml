name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint, test, build
    runs-on: ubuntu-latest

    # The app lives one level down; the repo root holds only docs.
    defaults:
      run:
        working-directory: wencetongol

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wencetongol/package-lock.json

      # ci, not install: build from the lockfile so a run cannot drift.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

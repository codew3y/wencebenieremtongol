name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # ci, not install: build from the lockfiles so a run cannot drift. The
      # root holds the backend's lint tooling; the frontend has its own.
      - run: npm ci
      - run: npm ci --prefix frontend

      # Both halves: the root scripts lint and test the backend, then hand
      # over to the frontend's own.
      - run: npm run lint
      - run: npm test
      - run: npm run build
